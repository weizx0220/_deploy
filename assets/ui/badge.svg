<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#3a3226"/>
      <stop offset="0.75" stop-color="#221d14"/>
      <stop offset="1" stop-color="#14100a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d489"/>
      <stop offset="0.5" stop-color="#9a6f23"/>
      <stop offset="1" stop-color="#e8c97a"/>
    </linearGradient>
  </defs>
  <!-- 八角徽章底（正八边形） -->
  <polygon points="135,16 184,65 184,135 135,184 65,184 16,135 16,65 65,16"
