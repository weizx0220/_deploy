  <!-- 八方云点 -->
  <g fill="url(#rim)" opacity="0.85">
    <circle cx="100" cy="30" r="2.6"/><circle cx="150" cy="50" r="2.6"/>
    <circle cx="170" cy="100" r="2.6"/><circle cx="150" cy="150" r="2.6"/>
    <circle cx="100" cy="170" r="2.6"/><circle cx="50" cy="150" r="2.6"/>
    <circle cx="30" cy="100" r="2.6"/><circle cx="50" cy="50" r="2.6"/>
